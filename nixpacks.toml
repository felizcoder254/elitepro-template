[phpextensions]
sqlite3 = "latest"
pdo_sqlite = "latest"
mbstring = "latest"
openssl = "latest"
tokenizer = "latest"
xml = "latest"
ctype = "latest"
curl = "latest"
dom = "latest"
fileinfo = "latest"
filter = "latest"
hash = "latest"
json = "latest"

[build]
composer = "2"

[build.args]
PHP_VERSION = "8.2"

[start]
cmd = "php artisan serve --host=0.0.0.0 --port=$PORT"